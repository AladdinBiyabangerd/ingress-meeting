services:
  ingress-meeting:
    build: .
    image: ingress-meeting:latest
    ports:
      - "8080:8080"
    environment:
      # Optional — only for standalone /api/openai/process (Whisper path does not summarize)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      API_SECRET_KEY: ${API_SECRET_KEY:-}
      ACADEMY_CALLBACK_BASE_URL: ${ACADEMY_CALLBACK_BASE_URL:-}
      # whisper.cpp ggml (quantized large-v3 — much faster on CPU than PyTorch)
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      WHISPER_MODEL_DIR: /models/whisper
      WHISPER_LANGUAGE: az
      WHISPER_THREADS: ${WHISPER_THREADS:-0}
      WHISPER_CLI_PATH: /usr/local/bin/whisper-cli
      UPLOAD_DIR: /data/uploads
      RESULTS_DIR: /data/results
      # Java heap can stay modest; whisper.cpp uses native RAM
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx2g}
    volumes:
      - whisper-models:/models/whisper
      - whisper-uploads:/data/uploads
      - whisper-results:/data/results
    restart: unless-stopped
    mem_limit: 16g

volumes:
  whisper-models:
  whisper-uploads:
  whisper-results:
