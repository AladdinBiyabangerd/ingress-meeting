app:
  upload-dir: ${UPLOAD_DIR:${java.io.tmpdir}/ingress-meeting-uploads}
  results-dir: ${RESULTS_DIR:${java.io.tmpdir}/ingress-meeting-results}
  api-secret: ${API_SECRET_KEY:}

# Academy webhook base (no trailing slash). Example:
#   https://ingress.academy/portal/api/meeting/jobs
# Meeting POSTs {base}/{jobId}/complete when transcription finishes.
academy:
  callback-base-url: ${ACADEMY_CALLBACK_BASE_URL:}

spring:
  application:
    name: ingress-meeting
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1000MB
      location: ${UPLOAD_DIR:${java.io.tmpdir}/ingress-meeting-uploads}

whisper:
  # ggml model name without path, e.g. large-v3-q5_0 → ggml-large-v3-q5_0.bin
  model: ${WHISPER_MODEL:large-v3-q5_0}
  model-dir: ${WHISPER_MODEL_DIR:${user.home}/.cache/whisper}
  cli-path: ${WHISPER_CLI_PATH:whisper-cli}
  ffmpeg-path: ${WHISPER_FFMPEG_PATH:ffmpeg}
  language: ${WHISPER_LANGUAGE:az}
  # 0 = use all available CPU cores
  threads: ${WHISPER_THREADS:0}

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    az.aladdin.ingressmeeting: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
